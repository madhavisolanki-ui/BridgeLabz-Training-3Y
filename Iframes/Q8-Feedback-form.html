<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Author information -->
    <meta name="author" content="Madhavi Solanki">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Feedback Form</title>
</head>

<body>

    <!-- Main heading -->
    <h1>Feedback Form</h1>

    <!-- Feedback form -->
    <form method="post" action="#">

        <!-- Feedback textarea -->
        <label for="feedback">Your Feedback:</label>
        <br>
        <textarea id="feedback" name="feedback" rows="5" cols="40" required></textarea>
        <br><br>

        <!-- Rating options -->
        <p>Rate your experience:</p>

        <input type="radio" id="good" name="rating" value="Good" required>
        <label for="good">Good</label>
        <br>

        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label>
        <br>

        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label>
        <br><br>

        <!-- Submit button -->
        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
