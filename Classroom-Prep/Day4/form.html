<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
    </head>

    <body>

        <center>

            <h1>Registration Form</h1>

            <form>

                <label for="name">
                    Name:
                </label>

                <input id="name" type="text" name="name"
                    placeholder="Enter your name:" required>

                <br><br>

                <label for="email">
                    Email:
                </label>

                <input id="email" type="email" name="email"
                    placeholder="Enter your email:" required>

                <br><br>

                <label for="pass">
                    Password:
                </label>

                <input id="pass" type="password" name="password"
                    placeholder="Enter your password:" required>

                <br><br>

                <label for="phone">
                    Phone:
                </label>

                <select name="country-code">
                    <option value="+91">+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+49">+49</option>
                    <option value="+33">+33</option>
                    <option value="+81">+81</option>
                    <option value="+86">+86</option>
                    <option value="+971">+971</option>
                </select>

                <input id="phone" type="tel" name="phone"
                    placeholder="Enter phone number" required>

                <br><br>

                <input type="file" name="file">

                <br><br>

                <input type="range" max="9" min="0">

                <br><br>

                <label>Skills:</label>

                <select name="skills" size="3" multiple>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JS">JS</option>
                </select>

                <br><br>

                <section>
                    <label>Skills:</label>

                    <input id="HTML" type="checkbox"
                        name="skills" value="HTML">
                    <label for="HTML">HTML</label>

                    <input id="CSS" type="checkbox"
                        name="skills" value="CSS">
                    <label for="CSS">CSS</label>

                    <input id="JAVA" type="checkbox"
                        name="skills" value="JAVA">
                    <label for="JAVA">JAVA</label>
                </section>

                <br>

                <section>
                    <label>Gender:</label>

                    <input id="male" type="radio"
                        name="gender" value="male">
                    <label for="male">Male</label>

                    <input id="female" type="radio"
                        name="gender" value="female">
                    <label for="female">Female</label>

                    <input id="not-disclose" type="radio"
                        name="gender" value="not-disclose">
                    <label for="not-disclose">Not to disclose</label>
                </section>

                <br><br>

                <button type="submit">
                    Submit
                </button>

            </form>

        </center>

    </body>
</html>
