<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>Google Map</title>
</head>

<body>

    <!-- ================= PAGE HEADING ================= -->
    <h1>My City - Mathura</h1>

    <!-- ================= GOOGLE MAP ================= -->
    <!-- loading="lazy" means the map loads only when it is close to becoming visible on the screen. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar Pradesh,India&output=embed"
        title="Google Map showing Mathura, Uttar Pradesh"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>

</html>
