<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting</title>
</head>

<body>

    <!-- Creative Paragraph with Inline Elements -->
    <p>
        Learning <strong>web development</strong> is an
        <em>exciting journey</em> for me. I enjoy creating
        <mark>creative websites</mark> using HTML and CSS.
        Writing <code>&lt;h1&gt;Hello World&lt;/h1&gt;</code> helps me
        understand how webpages are structured, while
        <small>regular practice makes my skills better.</small>
    </p>

</body>

</html>
